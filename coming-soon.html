    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://unpkg.com/split-type"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Loader Out
            gsap.to('.loader-content', {
                y: -50,
                opacity: 0,
                duration: 0.8,
                ease: 'power3.in',
                delay: 1.0
            });
            gsap.to('#loader', {
                yPercent: -100,
                duration: 1.2,
                ease: 'expo.inOut',
                delay: 1.3,
                onComplete: () => {
                    document.getElementById('loader').style.display = 'none';
                }
            });

            // Text split and reveal
            const titleSplit = new SplitType('.soon-title .line', { types: 'chars' });
            
            gsap.from(titleSplit.chars, {
                y: 100,
                opacity: 0,
                rotation: () => gsap.utils.random(-25, 25),
                duration: 1.2,
                stagger: 0.05,
                ease: "back.out(1.7)",
                delay: 0.2
            });
            
            gsap.from('.soon-desc', {
                y: 30,
                opacity: 0,
                duration: 1,
                delay: 0.8,
                ease: "power3.out"
            });
            
            gsap.from('.soon-btn', {
                scale: 0.5,
                opacity: 0,
                duration: 0.8,
                delay: 1.1,
                ease: "back.out(2)"
            });
            
            // Floating items
            gsap.to('.floating-mug', {
                y: -30,
                rotation: 3,
                duration: 3,
                repeat: -1,
                yoyo: true,
                ease: "sine.inOut"
            });
            
            gsap.to('.floating-thinker', {
                y: -20,
                rotation: -5,
                duration: 4,
                repeat: -1,
                yoyo: true,
                ease: "sine.inOut",
                delay: 0.5
            });
            
            // BG Shapes entrance
            gsap.from('.shape-soon-1', {
                scale: 0,
                rotation: -90,
                duration: 2.5,
                ease: "power4.out"
            });
            
            gsap.from('.shape-soon-2', {
                scale: 0,
                rotation: 90,
                duration: 2.5,
                delay: 0.3,
                ease: "power4.out"
            });

            // Page Transition Logic
            document.querySelectorAll('a').forEach(anchor => {
                anchor.addEventListener('click', (e) => {
                    const href = anchor.getAttribute('href');
                    if (href && href !== '#' && !href.startsWith('http') && anchor.target !== '_blank') {
                        e.preventDefault();
                        const loader = document.getElementById('loader');
                        
                        if (loader) {
                            loader.style.display = 'flex';
                            gsap.set('#loader', { yPercent: -100 });
                            gsap.set('.loader-content', { y: -50, opacity: 0 });
                            
                            gsap.to('#loader', {
                                yPercent: 0,
                                duration: 0.8,
                                ease: 'expo.inOut'
                            });
                            
                            gsap.to('.loader-content', {
                                y: 0,
                                opacity: 1,
                                duration: 0.5,
                                delay: 0.4,
                                ease: 'power3.out',
                                onComplete: () => {
                                    window.location.href = href;
                                }
                            });
                        } else {
                            window.location.href = href;
                        }
                    }
                });
            });
        });
    </script>
</body>
